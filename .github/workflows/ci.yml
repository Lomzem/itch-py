name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # Downloads itch-sim and the vectors from the itch release pinned in tests/itch_release.py.
      - run: uv run pytest
      - name: Verify simulator user journeys
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.11'
        run: |
          uv run python .agents/skills/verify-itch-py/drive.py channels
          uv run python .agents/skills/verify-itch-py/drive.py profiles
          uv run python .agents/skills/verify-itch-py/drive.py locks
          uv run python .agents/skills/verify-itch-py/drive.py labels
      - name: Retain journey transcripts
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: .scratch/repo-improvements/verification-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
